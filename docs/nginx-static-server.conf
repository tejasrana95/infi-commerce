# Nginx Configuration for Static File Server
# Use this for production deployment at static.example.com
#
# Installation:
# 1. Copy this file to /etc/nginx/sites-available/static.example.com
# 2. Create symlink: ln -s /etc/nginx/sites-available/static.example.com /etc/nginx/sites-enabled/
# 3. Test config: nginx -t
# 4. Reload nginx: systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/m;

server {
    listen 80;
    listen [::]:80;
    server_name static.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name static.example.com;

    # SSL Configuration (use Certbot or your own certificates)
    ssl_certificate /etc/letsencrypt/live/static.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/static.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Root directory for uploads
    root /var/www/uploads;

    # Access and error logs
    access_log /var/log/nginx/static.example.com.access.log;
    error_log /var/log/nginx/static.example.com.error.log;

    # Disable directory listing
    autoindex off;

    # Rate limiting
    limit_req zone=static_limit burst=50 nodelay;
    limit_req_status 429;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range, Accept-Encoding" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;

    # Cache control for all static files
    location / {
        # Aggressive caching for immutable assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Enable gzip for text files
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_vary on;
        gzip_min_length 1024;
        
        # Enable sendfile for better performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # ETag support
        etag on;
        
        # Try files
        try_files $uri =404;
    }

    # Force download for potentially dangerous files
    location ~* \.(exe|sh|bat|cmd|ps1|php)$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Health check endpoint (for load balancers)
    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Custom error pages
    error_page 404 /404.json;
    location = /404.json {
        internal;
        add_header Content-Type application/json;
        return 404 '{"error":"Not Found","message":"The requested file was not found"}';
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json;
        return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later."}';
    }

    # Optional: Hotlink protection (uncomment to enable)
    # location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
    #     valid_referers none blocked example.com *.example.com;
    #     if ($invalid_referer) {
    #         return 403;
    #     }
    # }
}

